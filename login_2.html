<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document</title>
   <!-- FAVICON Y/O LOGOTIPO DE PAGINA -->

  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
   <!-- LIBRERIA DE FUENTES -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
   <!-- FRAMEWORK DE BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <!-- LIBRERIA DE ICONOS -->
  <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/login_2.css">

  <script src="https://www.google.com/recaptcha/enterprise.js"></script>

</head>
<body>

  <article class="container">
    <section class="row">
        <section class="col-xs-12 col-sm-7 col-md-7">
          <img src="img/foto.png" class="login__inicio" alt="">
        </section>
        <section class="col-xs-12 col-sm-5 col-md-5">
          <form action="">
            <img class="login__logo" src="img/Logo.svg" alt="">
            <h1 class="login__titulo">Bienvenido Colaborador</h1>
            <p class="login__parrafo">Ingrese sus credenciales</p>
            <div class="login__campo">
              <input type="text" class="login__id" placeholder="Usuario">

              <i class="fa-solid fa-user login__icono"></i>

            </div>
            <div class="login__campo">
              <input type="password" class="login__id" placeholder="Contraseña">
              <i class="fa-solid fa-eye-slash login__icono"></i>
            </div>
            <div class="form-check form-switch login__recordar">

              <input class="form-check-input" type="checkbox" role="switch" id="recordarUsuario">
              <label class="form-check-label" for="recordarUsuario">Recordar usuario</label>
              <a class="login__link" href="">¿Olvido sus credenciales?</a>

            </div>

            <div class="card p-3 shadow-sm border custom-captcha-box">
              <div class="d-flex align-items-center">
                <div class="form-check m-0">
                <input class="form-check-input border-2 border-secondary captcha-checkbox" type="checkbox" id="recaptchaCheck">
                </div>

                <label class="form-check-label ms-3 fw-semibold text-secondary-emphasis captcha-text" for="recaptchaCheck">
                No soy un robot
                </label>          
              </div>
            </div>
            <button class="login__boton">Ingresar</button>
          </form>
        </section> 


    </section>
  </article>

</body>
</html>
